name: Release Obsidian Plugin

# 태그 push 시 자동 릴리즈 생성
# 보안: 이 워크플로우는 untrusted 사용자 입력을 run: 명령에 사용하지 않음
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build plugin
        run: npm run build

      - name: Verify required release files
        run: |
          for f in main.js styles.css manifest.json; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
          done
          echo "All release files present"

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
